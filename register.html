<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — CryptoSim</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="navbar">
    <div class="logo">Crypto<span>Sim</span></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <main>
    <section class="auth-section">

      <div class="auth-card">

        <div class="badge">SIMULATION ACCOUNT</div>

        <h1>Create Account</h1>

        <p class="auth-subtitle">
          Create your free simulated crypto account.
        </p>

        <form id="registerForm">

          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
          >

          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            required
          >

          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Create a password"
            minlength="6"
            required
          >

          <button type="submit" class="btn primary auth-button">
            Create Account
          </button>

        </form>

        <p id="registerMessage" class="message"></p>

        <p class="auth-footer">
          Already have an account?
          <a href="login.html">Login</a>
        </p>

        <div class="simulation-note">
          This account uses virtual funds only. No real cryptocurrency
          is deposited, transferred or withdrawn.
        </div>

      </div>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="Supabase.js"></script>
  <script src="app.js"></script>

</body>
            </html>
