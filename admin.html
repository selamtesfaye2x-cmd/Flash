<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — CryptoSim</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
  <div class="logo">Crypto<span>Sim</span></div>

  <nav>
    <a href="dashboard.html">Dashboard</a>
    <button id="logoutButton" class="btn-secondary">Logout</button>
  </nav>
</header>

<main class="container dashboard">

  <h1>Admin Dashboard</h1>

  <p>Manage simulated user balances.</p>

  <div class="table-container">

    <table>
      <thead>
        <tr>
          <th>User ID</th>
          <th>Simulated USDT</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="usersTable">
        <tr>
          <td colspan="3">Loading users...</td>
        </tr>
      </tbody>
    </table>

  </div>

  <p id="message" class="message"></p>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="Supabase.js"></script>
<script src="app.js"></script>

<script>

async function loadAdminDashboard() {

  const {
    data: { user },
    error: userError
  } = await supabaseClient.auth.getUser();

  if (userError || !user) {
    window.location.href = "login.html";
    return;
  }

  // Check admin status
  const { data: adminStatus, error: adminError } =
    await supabaseClient.rpc("is_admin");

  if (adminError) {
    showError("Admin check failed: " + adminError.message);
    return;
  }

  if (!adminStatus) {
    showError("Access denied. Administrator account required.");
    return;
  }

  // Load simulated balances
  const { data: balances, error: balanceError } =
    await supabaseClient
      .from("user_balances")
      .select("id, user_id, simulated_usdt");

  if (balanceError) {
    showError("Database error: " + balanceError.message);
    return;
  }

  const table = document.getElementById("usersTable");

  table.innerHTML = "";

  if (!balances || balances.length === 0) {
    table.innerHTML =
      "<tr><td colspan='3'>No users found.</td></tr>";
    return;
  }

  balances.forEach(function(row) {

    const tr = document.createElement("tr");

    const balance = Number(row.simulated_usdt || 0);

    tr.innerHTML = `
      <td>${row.user_id}</td>

      <td>
        ${balance.toFixed(2)} USDT
      </td>

      <td>
        <button
          class="btn"
          onclick="changeBalance('${row.id}', ${balance})">
          Edit Balance
        </button>
      </td>
    `;

    table.appendChild(tr);

  });

}


function showError(text) {

  const message =
    document.getElementById("message");

  message.textContent = text;

  message.className =
    "message error";

  message.style.display =
    "block";
}


async function changeBalance(balanceId, currentBalance) {

  const newBalance = prompt(
    "Enter the new simulated USDT balance:",
    currentBalance
  );

  if (newBalance === null) {
    return;
  }

  const amount = Number(newBalance);

  if (!Number.isFinite(amount) || amount < 0) {

    alert(
      "Please enter a valid non-negative number."
    );

    return;
  }

  const { error } =
    await supabaseClient
      .from("user_balances")
      .update({
        simulated_usdt: amount
      })
      .eq("id", balanceId);

  if (error) {

    alert(
      "Unable to update balance: " +
      error.message
    );

    return;
  }

  alert(
    "Simulated balance updated successfully."
  );

  loadAdminDashboard();

}


document
  .getElementById("logoutButton")
  .addEventListener(
    "click",
    async function() {

      await supabaseClient.auth.signOut();

      window.location.href =
        "login.html";

    }
  );


loadAdminDashboard();

</script>

</body>
  </html>
