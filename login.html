<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — CryptoSim</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="navbar">
    <div class="logo">Crypto<span>Sim</span></div>

    <nav>
      <a href="index.html">Home</a>
      <a href="register.html" class="nav-button">Create Account</a>
    </nav>
  </header>

  <main>
    <section class="auth-section">

      <div class="auth-card">

        <div class="badge">SIMULATION PLATFORM</div>

        <h1>Welcome Back</h1>

        <p class="auth-subtitle">
          Login to your simulated crypto account.
        </p>

        <form id="loginForm">

          <label for="loginEmail">Email Address</label>

          <input
            type="email"
            id="loginEmail"
            placeholder="you@example.com"
            required
          >

          <label for="loginPassword">Password</label>

          <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            required
          >

          <button type="submit" class="btn primary auth-button">
            Login
          </button>

        </form>

        <p id="loginMessage" class="message"></p>

        <p class="auth-footer">
          Don't have an account?
          <a href="register.html">Create one</a>
        </p>

        <div class="simulation-note">
          This is a simulation website. Account balances and transactions
          have no real monetary value.
        </div>

      </div>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="Supabase.js"></script>
  <script src="app.js"></script>

</body>
</html>
