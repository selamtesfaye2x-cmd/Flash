<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Login — CryptoSim</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="navbar">

  <div class="logo">
    Crypto<span>Sim</span>
  </div>

  <nav>

    <a href="index.html">
      Home
    </a>

    <a href="register.html">
      Create Account
    </a>

  </nav>

</header>



<main class="container">


  <div class="form-container">

    <h1>
      Login
    </h1>

    <p>
      Login to your simulated trading account.
    </p>


    <form id="loginForm">


      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required>

      </div>



      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required>

      </div>



      <button
        type="submit"
        id="loginButton"
        class="btn-primary">

        Login

      </button>


      <div
        id="loginMessage"
        class="message">
      </div>


    </form>


    <p>

      Don't have an account?

      <a href="register.html">
        Create one
      </a>

    </p>


  </div>


</main>



<!-- SUPABASE LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- OUR SUPABASE CONNECTION -->
<script src="Supabase.js"></script>



<script>

/* =================================
   LOGIN
================================= */

const loginForm =
  document.getElementById("loginForm");


loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const email =
      document.getElementById("email")
      .value
      .trim();


    const password =
      document.getElementById("password")
      .value;


    const message =
      document.getElementById("loginMessage");


    const button =
      document.getElementById("loginButton");


    message.style.display = "block";

    message.className = "message";

    message.textContent =
      "Logging in...";


    button.disabled = true;

    button.textContent =
      "Logging in...";


    try {


      /* CHECK CONNECTION */

      if (
        !window.supabaseClient
      ) {

        throw new Error(
          "Supabase connection failed. Please check Supabase.js."
        );

      }


      /* LOGIN */

      const {
        data,
        error
      } =
        await window.supabaseClient.auth
        .signInWithPassword({

          email: email,

          password: password

        });


      if (error) {

        throw error;

      }


      /* SUCCESS */

      message.className =
        "message success";

      message.textContent =
        "Login successful!";


      setTimeout(
        function() {

          window.location.href =
            "dashboard.html";

        },
        800
      );


    }

    catch(error) {

      console.error(
        "LOGIN ERROR:",
        error
      );


      message.className =
        "message error";

      message.textContent =
        error.message;


      button.disabled = false;

      button.textContent =
        "Login";

    }

  }
);

</script>


</body>

         </html>
