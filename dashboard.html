<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — CryptoSim</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
  <div class="logo">Crypto<span>Sim</span></div>

  <nav>
    <a href="index.html">Home</a>
    <button id="logoutButton" class="btn-secondary">Logout</button>
  </nav>
</header>

<main class="container dashboard">

  <h1 id="welcome">Loading...</h1>

  <div class="balance-card">
    <h2>Simulated USDT Balance</h2>

    <div class="balance">
      <span id="balance">0.00</span> USDT
    </div>
  </div>

  <div class="cards">

    <div class="card">
      <h3>USDT</h3>
      <p>Simulated Tether balance</p>
    </div>

    <div class="card">
      <h3>Account</h3>
      <p id="userEmail">Loading...</p>
    </div>

    <div class="card">
      <h3>Transactions</h3>
      <p id="transactionCount">Loading...</p>
    </div>

  </div>


  <!-- BALANCE -->

  <div class="table-container">

    <h2>Account Balance</h2>

    <table>

      <thead>
        <tr>
          <th>Asset</th>
          <th>Balance</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody>

        <tr>
          <td>USDT</td>

          <td>
            <span id="tableBalance">0.00</span>
          </td>

          <td>Simulated</td>
        </tr>

      </tbody>

    </table>

  </div>


  <!-- TRANSACTIONS -->

  <div class="table-container">

    <h2>Transaction History</h2>

    <table>

      <thead>
        <tr>
          <th>Type</th>
          <th>Amount</th>
          <th>Status</th>
          <th>Description</th>
          <th>Date</th>
        </tr>
      </thead>

      <tbody id="transactionsTable">

        <tr>
          <td colspan="5">
            Loading transactions...
          </td>
        </tr>

      </tbody>

    </table>

  </div>


  <p id="message" class="message"></p>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="Supabase.js"></script>
<script src="app.js"></script>


<script>

async function loadDashboard() {

  const {
    data: { user },
    error: userError
  } = await supabaseClient.auth.getUser();


  if (userError || !user) {

    window.location.href = "login.html";
    return;

  }


  // USER INFORMATION

  const fullName =
    user.user_metadata?.full_name || user.email;


  document.getElementById("welcome").textContent =
    "Welcome, " + fullName;


  document.getElementById("userEmail").textContent =
    user.email;


  // LOAD BALANCE

  const {
    data: balanceRow,
    error: balanceError
  } = await supabaseClient
    .from("user_balances")
    .select("simulated_usdt")
    .eq("user_id", user.id)
    .maybeSingle();


  if (balanceError) {

    console.error(balanceError);

    showError(
      "Unable to load your simulated balance: " +
      balanceError.message
    );

    return;

  }


  // CREATE BALANCE IF MISSING

  if (!balanceRow) {

    const {
      data: newBalance,
      error: insertError
    } = await supabaseClient
      .from("user_balances")
      .insert({
        user_id: user.id,
        simulated_usdt: 0
      })
      .select("simulated_usdt")
      .single();


    if (insertError) {

      console.error(insertError);

      showError(
        "Unable to create your simulated balance: " +
        insertError.message
      );

      return;

    }


    displayBalance(
      newBalance.simulated_usdt
    );

  } else {

    displayBalance(
      balanceRow.simulated_usdt
    );

  }


  // LOAD TRANSACTIONS

  await loadTransactions(user.id);

}


/* DISPLAY BALANCE */

function displayBalance(amount) {

  const formatted =
    Number(amount || 0).toLocaleString(
      "en-US",
      {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }
    );


  document.getElementById("balance").textContent =
    formatted;


  document.getElementById("tableBalance").textContent =
    formatted;

}


/* LOAD TRANSACTIONS */

async function loadTransactions(userId) {

  const {
    data: transactions,
    error
  } = await supabaseClient
    .from("transactions")
    .select(
      "id, type, amount, status, description, created_at"
    )
    .eq("user_id", userId)
    .order("created_at", {
      ascending: false
    });


  const table =
    document.getElementById(
      "transactionsTable"
    );


  /* SHOW ACTUAL SUPABASE ERROR */

  if (error) {

    console.error(
      "TRANSACTION ERROR:",
      error
    );


    table.innerHTML =
      "<tr>" +
      "<td colspan='5'>" +
      "Transaction error: " +
      escapeHtml(error.message) +
      "</td>" +
      "</tr>";


    document.getElementById(
      "transactionCount"
    ).textContent =
      "Unable to load";


    return;

  }


  table.innerHTML = "";


  /* NO TRANSACTIONS */

  if (
    !transactions ||
    transactions.length === 0
  ) {

    table.innerHTML =
      "<tr>" +
      "<td colspan='5'>" +
      "No simulated transactions yet." +
      "</td>" +
      "</tr>";


    document.getElementById(
      "transactionCount"
    ).textContent =
      "No transactions";


    return;

  }


  /* TRANSACTION COUNT */

  document.getElementById(
    "transactionCount"
  ).textContent =
    transactions.length +
    (
      transactions.length === 1
        ? " transaction"
        : " transactions"
    );


  /* DISPLAY TRANSACTIONS */

  transactions.forEach(
    function(transaction) {

      const tr =
        document.createElement("tr");


      const amount =
        Number(
          transaction.amount || 0
        ).toLocaleString(
          "en-US",
          {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }
        );


      const date =
        new Date(
          transaction.created_at
        ).toLocaleString(
          "en-US",
          {
            dateStyle: "medium",
            timeStyle: "short"
          }
        );


      tr.innerHTML = `

        <td>
          ${escapeHtml(transaction.type)}
        </td>

        <td>
          ${amount} USDT
        </td>

        <td>
          ${escapeHtml(transaction.status)}
        </td>

        <td>
          ${escapeHtml(
            transaction.description || "-"
          )}
        </td>

        <td>
          ${date}
        </td>

      `;


      table.appendChild(tr);

    }
  );

}


/* SECURITY */

function escapeHtml(value) {

  const div =
    document.createElement("div");


  div.textContent =
    value == null
      ? ""
      : String(value);


  return div.innerHTML;

}


/* ERROR MESSAGE */

function showError(text) {

  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    text;


  message.className =
    "message error";


  message.style.display =
    "block";

}


/* LOGOUT */

document
  .getElementById("logoutButton")
  .addEventListener(
    "click",
    async function() {

      const { error } =
        await supabaseClient.auth.signOut();


      if (error) {

        showError(
          error.message
        );

        return;

      }


      window.location.href =
        "login.html";

    }
  );


/* START */

loadDashboard();

</script>

</body>
  </html>
