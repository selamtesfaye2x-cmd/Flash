<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — CryptoSim</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="navbar">
    <div class="logo">Crypto<span>Sim</span></div>

    <nav>
      <a href="index.html">Home</a>
      <button id="logoutButton" class="btn-secondary">Logout</button>
    </nav>
  </header>

  <main class="container dashboard">

    <h1 id="welcome">Loading...</h1>

    <div class="balance-card">
      <h2>Simulated USDT Balance</h2>
      <div class="balance">
        <span id="balance">0.00</span> USDT
      </div>
    </div>

    <div class="cards">

      <div class="card">
        <h3>USDT</h3>
        <p>Simulated Tether balance</p>
      </div>

      <div class="card">
        <h3>Account</h3>
        <p id="userEmail">Loading...</p>
      </div>

      <div class="card">
        <h3>Transactions</h3>
        <p>No simulated transactions yet.</p>
      </div>

    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Asset</th>
            <th>Balance</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td>USDT</td>
            <td><span id="tableBalance">0.00</span></td>
            <td>Simulated</td>
          </tr>
        </tbody>
      </table>
    </div>

    <p id="message" class="message"></p>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="Supabase.js"></script>
  <script src="app.js"></script>

  <script>
    async function loadDashboard() {
      const {
        data: { user },
        error
      } = await supabaseClient.auth.getUser();

      if (error || !user) {
        window.location.href = "login.html";
        return;
      }

      const fullName =
        user.user_metadata?.full_name || user.email;

      document.getElementById("welcome").textContent =
        "Welcome, " + fullName;

      document.getElementById("userEmail").textContent =
        user.email;

      document.getElementById("balance").textContent =
        "0.00";

      document.getElementById("tableBalance").textContent =
        "0.00";
    }

    document.getElementById("logoutButton").addEventListener(
      "click",
      async function() {

        const { error } =
          await supabaseClient.auth.signOut();

        if (error) {
          document.getElementById("message").textContent =
            error.message;
          document.getElementById("message").style.display = "block";
          return;
        }

        window.location.href = "login.html";
      }
    );

    loadDashboard();
  </script>

</body>
</html>
